<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">
  <style>
    :root{--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--accent:#0969da}
    @media (prefers-color-scheme: dark){:root{--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--accent:#4493f8}}
    .t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
    .m{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
    .ln{stroke:var(--line);stroke-width:1}
    .bar{fill:var(--accent)}
  </style>
  <g transform="translate(40,0)">
    <rect x="0" y="16" width="2" height="118" class="bar"/>
    <text x="22" y="38" class="m">building</text>
    <text x="120" y="38" class="t">Enterprise tourism &amp; booking platforms — .NET + Angular</text>
    <line x1="22" y1="56" x2="760" y2="56" class="ln"/>
    <text x="22" y="82" class="m">learning</text>
    <text x="120" y="82" class="t">Software architecture, clean boundaries, performance</text>
    <line x1="22" y1="100" x2="760" y2="100" class="ln"/>
    <text x="22" y="126" class="m">enjoying</text>
    <text x="120" y="126" class="t">Turning legacy code into something readable</text>
  </g>
</svg>
