<svg xmlns="http://www.w3.org/2000/svg" width="840" height="236" viewBox="0 0 840 236">
  <style>
    :root{--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--chip:#f6f8fa;--accent:#0969da}
    @media (prefers-color-scheme: dark){:root{--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--chip:#161b22;--accent:#4493f8}}
    .lbl{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted);letter-spacing:1.5px}
    .t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
    .c{fill:var(--chip);stroke:var(--line);stroke-width:1}
    .dot{fill:var(--accent)}
  </style>
  <g transform="translate(40,0)">
    <circle cx="4" cy="30" r="3" class="dot"/><text x="16" y="34" class="lbl">BACKEND</text>
    <g transform="translate(160,14)">
      <rect width="64" height="32" rx="6" class="c"/><text x="32" y="21" class="t" text-anchor="middle">.NET</text>
      <rect x="74" width="48" height="32" rx="6" class="c"/><text x="98" y="21" class="t" text-anchor="middle">C#</text>
      <rect x="132" width="74" height="32" rx="6" class="c"/><text x="169" y="21" class="t" text-anchor="middle">Python</text>
      <rect x="216" width="72" height="32" rx="6" class="c"/><text x="252" y="21" class="t" text-anchor="middle">Django</text>
      <rect x="298" width="100" height="32" rx="6" class="c"/><text x="348" y="21" class="t" text-anchor="middle">REST APIs</text>
    </g>

    <circle cx="4" cy="86" r="3" class="dot"/><text x="16" y="90" class="lbl">FRONTEND</text>
    <g transform="translate(160,70)">
      <rect width="80" height="32" rx="6" class="c"/><text x="40" y="21" class="t" text-anchor="middle">Angular</text>
      <rect x="90" width="100" height="32" rx="6" class="c"/><text x="140" y="21" class="t" text-anchor="middle">TypeScript</text>
      <rect x="200" width="96" height="32" rx="6" class="c"/><text x="248" y="21" class="t" text-anchor="middle">JavaScript</text>
      <rect x="306" width="92" height="32" rx="6" class="c"/><text x="352" y="21" class="t" text-anchor="middle">HTML/CSS</text>
    </g>

    <circle cx="4" cy="142" r="3" class="dot"/><text x="16" y="146" class="lbl">DATA</text>
    <g transform="translate(160,126)">
      <rect width="100" height="32" rx="6" class="c"/><text x="50" y="21" class="t" text-anchor="middle">SQL Server</text>
      <rect x="110" width="100" height="32" rx="6" class="c"/><text x="160" y="21" class="t" text-anchor="middle">PostgreSQL</text>
      <rect x="220" width="70" height="32" rx="6" class="c"/><text x="255" y="21" class="t" text-anchor="middle">MySQL</text>
    </g>

    <circle cx="4" cy="198" r="3" class="dot"/><text x="16" y="202" class="lbl">TOOLING</text>
    <g transform="translate(160,182)">
      <rect width="72" height="32" rx="6" class="c"/><text x="36" y="21" class="t" text-anchor="middle">Docker</text>
      <rect x="82" width="48" height="32" rx="6" class="c"/><text x="106" y="21" class="t" text-anchor="middle">Git</text>
      <rect x="140" width="62" height="32" rx="6" class="c"/><text x="171" y="21" class="t" text-anchor="middle">Linux</text>
      <rect x="212" width="64" height="32" rx="6" class="c"/><text x="244" y="21" class="t" text-anchor="middle">Nginx</text>
      <rect x="286" width="56" height="32" rx="6" class="c"/><text x="314" y="21" class="t" text-anchor="middle">IIS</text>
    </g>
  </g>
</svg>
